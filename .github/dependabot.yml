# Pinning actions to commit SHAs trades one risk for another: a mutable tag cannot be
# hijacked, but a pin never picks up a security fix on its own. Dependabot is the half that
# makes the pin sustainable — it opens a PR rewriting the SHA and the version comment
# together, so the pins stay current without anyone reading release feeds.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the routine bumps. A compromised action is not a per-action decision to
      # make on a Monday morning; a single reviewable diff is more likely to be read.
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Majors land as their own PR: React, Tailwind and Vite majors have all shipped
    # breaking changes that the test suite would catch but a grouped diff would bury.
