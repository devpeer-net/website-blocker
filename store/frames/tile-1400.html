<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Website Blocker — marquee promo tile</title>
<link rel="stylesheet" href="frame.css">
<style>
  /* 1400x560 marquee (optional — only rendered if Google features the
     extension). Same lockup and same tokens as the 440x280 tile, with room to
     breathe, so the two cannot drift apart. */
  .lockup .mark { width: 250px; height: 250px; }
</style>
</head>
<body>

<div class="canvas tile-1400">
  <div class="bg"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 24 24" fill="none">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" fill="#ffffff"/>
      <path d="m9 12 2 2 4-4" stroke="#2b36ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wordmark">Website Blocker</div>
    <div class="tagline">Block distracting sites</div>
  </div>
</div>

</body>
</html>
